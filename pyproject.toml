[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-devops-agent"
version = "0.1.1"
description = "Multi-agent DevOps CLI: scaffolds Docker/CI/k8s, runs GitHub Actions, monitors and self-heals — with human approval gates."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fatma Abdulfattah", email = "fatmaabdulfattah22@gmail.com" },
  { name = "Huda Mawood", email = "hudamawood@gmail.com" },
  { name = "Zainab Ehab", email = "zainabehab297@gmail.com" },
  ]
license = "MIT"   
keywords = ["devops", "agent", "llm", "docker", "github-actions", "kubernetes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

# One install = everything: all 5 agents, all LLM providers, embedded Qdrant.
dependencies = [
    "groq>=0.9",
    "ollama>=0.4",
    "openai>=1.40",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "aiohttp>=3.9",         # approval server + GitHub provider
    # Knowledge agent (always included)
    "qdrant-client>=1.12",  # embedded mode = no Qdrant server / Docker needed
    "fastembed>=0.4",       # ONNX embeddings, no torch
    "ddgs>=9.0",
    "duckduckgo-search>=8.0",
]

[project.optional-dependencies]
# Optional: use sentence-transformers/torch instead of fastembed (same model, ~1-2 GB)
torch = ["sentence-transformers>=3.0"]
local = []       # kept so old install commands still work
providers = []   # kept so old install commands still work
all = []
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build", "twine"]

[project.scripts]
devops = "auto_devops_agent.cli:main"

[project.urls]
Homepage = "https://github.com/TODO/autonomous-devops-agent"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json"]
